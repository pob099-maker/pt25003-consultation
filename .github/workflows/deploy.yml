name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set this repository variable to /<repo-name>/ for a GitHub Pages
          # project site. Leave it unset for a custom domain served from root.
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PROJECT_ID: ${{ vars.VITE_PROJECT_ID }}
          VITE_HOME_URL: ${{ vars.VITE_HOME_URL }}
          VITE_PROJECT_CONTACTS: ${{ vars.VITE_PROJECT_CONTACTS }}
          VITE_PRIVACY_CONTACT_NAME: ${{ vars.VITE_PRIVACY_CONTACT_NAME }}
          VITE_PRIVACY_CONTACT_EMAIL: ${{ vars.VITE_PRIVACY_CONTACT_EMAIL }}
      # The demonstration site at /demo/: the same code on invented data, built
      # with no database credentials at all. It is what we send to people who
      # want to see the tool, instead of a login to the real one.
      - run: npx vite build --outDir dist/demo --emptyOutDir
        env:
          VITE_BASE: /demo/
          VITE_DEMO: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
          VITE_PROJECT_ID: ${{ vars.VITE_PROJECT_ID }}
          VITE_HOME_URL: ${{ vars.VITE_HOME_URL }}
          VITE_PROJECT_CONTACTS: ${{ vars.VITE_PROJECT_CONTACTS }}
          VITE_PRIVACY_CONTACT_NAME: ${{ vars.VITE_PRIVACY_CONTACT_NAME }}
          VITE_PRIVACY_CONTACT_EMAIL: ${{ vars.VITE_PRIVACY_CONTACT_EMAIL }}
      - name: Check the demo cannot reach the database
        env:
          DATABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ] && grep -rqF "$DATABASE_URL" dist/demo; then
            echo "The demo build contains the database address. Refusing to publish it."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
