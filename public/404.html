<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>Potato Mechanisation Project Consultation</title>
    <script>
      // GitHub Pages has no SPA fallback: a path-style link lands here instead
      // of the app. Send it to its hash equivalent rather than showing a 404 to
      // somebody who was asked to give us ten minutes.
      (function () {
        var base = location.pathname.replace(/\/[^/]*$/, '/');
        var path = location.pathname.slice(base.length);
        location.replace(base + '#/' + path + location.search);
      })();
    </script>
  </head>
  <body>
    <p>Taking you to the consultation…</p>
  </body>
</html>
