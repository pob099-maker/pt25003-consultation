<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Consultation for the Potato Mechanisation Project (PT25003). Share practical input on mechanisation, automation and extension priorities for the Australian potato industry." />
    <meta name="robots" content="noindex" />
    <title>Potato Mechanisation Project Consultation</title>
    <script>
      /*
       * A deploy replaces the built filenames, and a browser holding a cached
       * index.html then asks for a file that no longer exists. Nothing renders,
       * nothing is logged, and the person sees a white page — which is how the
       * admin screen failed after this morning's release.
       *
       * Reload once, past the cache, and the fresh index.html points at files
       * that are actually there. The flag makes it once per tab, so a genuine
       * outage cannot turn into a reload loop.
       */
      window.__bootFailed = function () {
        try {
          if (sessionStorage.getItem('pt25003.reloaded') === '1') return;
          sessionStorage.setItem('pt25003.reloaded', '1');
        } catch (error) {
          /* Private mode. One reload is still better than a blank page. */
        }
        // Keep the rest of the query, so a magazine link's label survives it.
        var params = new URLSearchParams(window.location.search);
        params.set('v', String(Date.now()));
        window.location.replace(window.location.pathname + '?' + params.toString() + window.location.hash);
      };
      /*
       * The build drops an onerror attribute from the app's own script tag, so
       * the recovery above never ran in production. A script that fails to
       * load still reaches the window in the capture phase, whatever its tag
       * carries, so it is listened for here instead.
       */
      window.addEventListener(
        'error',
        function (event) {
          var target = event.target;
          if (target && target.tagName === 'SCRIPT' && target.type === 'module') window.__bootFailed();
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="max-width: 34rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.6">
        This consultation needs JavaScript turned on. If you would rather not, email
        <a href="mailto:peter.obrien@agaims.com.au">peter.obrien@agaims.com.au</a> and we will ring you to take your
        answers over the phone. They count the same either way.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
